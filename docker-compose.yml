services:
  db_main:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: master_bot_db_main
    restart: always
    privileged: true
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-master_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
    # Points explicitly to the true absolute binary location inside Ubuntu's file footprint
    command: ["/usr/lib/postgresql/18/bin/postgres", "-D", "/var/lib/postgresql/data", "-c", "listen_addresses=*", "-c", "wal_level=logical"]

  db_shadow:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: master_bot_db_shadow
    restart: always
    privileged: true
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-master_bot}_shadow
    ports:
      - "5433:5432"
    volumes:
      - postgres_shadow_data:/var/lib/postgresql/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["/usr/lib/postgresql/18/bin/postgres", "-D", "/var/lib/postgresql/data", "-c", "listen_addresses=*"]

  redis:
    image: redis:alpine
    container_name: master_bot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_main_data:
  postgres_shadow_data:
  redis_data:
